name: ci

# Lints the shell, then proves the whole tool works end-to-end (install → init →
# agent loop → verify → merge) via the offline smoke test. Runs on macOS too:
# its default /bin/bash is 3.2, which is chief's compatibility floor.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install tools (shellcheck, jq)
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck jq
          else
            command -v shellcheck >/dev/null || brew install shellcheck
            command -v jq         >/dev/null || brew install jq
          fi

      - name: Report bash version (macOS should be 3.2 — the compat floor)
        run: bash --version | head -1

      - name: Syntax check (bash -n)
        run: |
          for f in bin/chief engine/*.sh install.sh test/*.sh templates/verify.sh; do
            echo "bash -n $f"; bash -n "$f"
          done

      - name: ShellCheck (errors only — the scripts use deliberate word-splitting)
        run: shellcheck -S error bin/chief engine/*.sh install.sh test/*.sh templates/verify.sh

      - name: End-to-end smoke test (offline, deterministic)
        run: bash test/smoke.sh

      - name: Provider/model selection
        run: bash test/provider.sh

      - name: Provider conformance (argv · prompt channel · model stance · roster-drift guard)
        run: bash test/provider-conformance.sh

      - name: Token-limit pause+resume under the parallel driver
        run: bash test/ratelimit.sh

      - name: Usage-limit pause is a distinct state (never 'failed', never blocks dependents)
        run: bash test/limitstate.sh

      - name: Usage-limit self-heal (scheduler waits out the window and re-dispatches, bounded)
        run: bash test/limitresume.sh

      - name: Usage-limit pause is legible in `chief ps` (paused + retry ETA, not failed/hung)
        run: bash test/limitmonitor.sh

      - name: Operator pause drains at a safe checkpoint, parks, and resumes from committed state
        run: bash test/pause.sh

      - name: Plan review (approved implements · annotated re-plans within budget · no reviewer parks)
        run: bash test/plan-review.sh

      - name: Research phase (produced once · carried into every story · reused on resume · hand-editable)
        run: bash test/research.sh

      - name: Fine-grained liveliness record + `chief ps` (progress · stalled · paused)
        run: bash test/liveliness.sh

      - name: Live-monitor registry (ps/monitor) under the parallel driver
        run: bash test/monitor.sh

      - name: Teardown — an interrupt reaps the tree before releasing the records
        run: bash test/teardown.sh

      - name: Orphan reaper — finds the engine by cwd + run marker, never a live run
        run: bash test/reapscope.sh

      - name: Inherited-$CHIEF_RUN_ID key — gated to a dead run, never a shell or a live run
        run: bash test/reapenv.sh

      - name: Build-artifact sweep — refuses a shared cache, a symlink, a foreign worktree
        run: bash test/sweep.sh

      - name: Bystander guard — the suite must not reap a run it did not start
        run: bash test/bystander.sh

      - name: No-work guard (false-complete must not merge/retire)
        run: bash test/noworkguard.sh

      - name: Evidence gate (a force-passed story with empty notes must not merge)
        run: bash test/evidence-gate.sh

      - name: Bar rule at the iteration boundary (an unmeasured story is demoted before the next turn)
        run: bash test/boundary-demotion.sh

      - name: Stall flag is run-state aware (a quiet-by-design phase is not also called stalled)
        run: bash test/stall-flag.sh

      - name: Headless embedding contract (run-id line, exit-code table, JSON summary)
        run: bash test/headless.sh

      - name: Account credential seam (designated env reaches the provider ONLY; values leak nowhere)
        run: bash test/account-env.sh

      - name: Container-shaped conditions (no $HOME, relocated worktrees, dubious ownership, foreign PID ns)
        run: bash test/container.sh

      - name: NDJSON event stream (per-run log, versioned schema, merged + verify-failed sequences)
        run: bash test/events.sh

      - name: Pickup-time base integration (a resumed branch follows base; conflicts go to the agent)
        run: bash test/stale-resume.sh

      - name: Conflict forensics (a merge-phase conflict names the files and the colliding sibling)
        run: bash test/conflict-forensics.sh

      - name: Refused rebase vs real conflict (a dirty work repo is not a merge conflict)
        run: bash test/rebase-refusal.sh

      - name: Dirty operator checkout (the merge parks uncommitted work and always gives it back)
        run: bash test/dirty-checkout.sh

      - name: Submodule gitlink bump (a pin bump merges; work inside a submodule still blocks)
        run: bash test/submodule-gitlink.sh

      - name: Submodule story progress survives a kill (2/3 resumes at US-3; the project arm is unmoved)
        run: bash test/submodule-resume.sh

      - name: Under-tagged touches audit (co-scheduled tasklists that edited the same file are reported)
        run: bash test/touches-audit.sh

      - name: Code-quality ratchet (slop BLOCKED, refactor ALLOWED, unmeasurable languages skipped not zeroed)
        run: bash test/quality-ratchet.sh

      - name: Merge policy layer (a review zone / oversized story holds a GREEN branch for one durable approval)
        run: bash test/overlap-zones.sh

      - name: Merge queue (batch tip verified ONCE; red tip bisected; ratchet attributed; absent, the floor verifies N times)
        run: bash test/merge-batch.sh

      - name: Roadmap -> tasklists generator (contract enforced, conventions correct)
        run: bash test/gen.sh

      - name: Doc sync (README's version string + command table vs the engine)
        run: bash test/doc-sync.sh

      - name: Dry-run schedule of the bundled example
        working-directory: examples/minimal
        run: |
          "$GITHUB_WORKSPACE/bin/chief" run -n -p 3
