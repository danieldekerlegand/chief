# .chief/quality.conf — the code-quality RATCHET's per-repo settings.
#
# Read by `engine/quality.sh ratchet` (sourced as bash, in a subshell — it can
# only contribute CHIEF_QUALITY_* values, never move CHIEF_BASE_BRANCH or any
# other engine variable). Precedence: environment > this file > .chief/config >
# the built-in defaults shown below.
#
# WHY THIS FILE IS COMMITTED. The ratchet blocks a merge that makes the codebase
# measurably worse, and the only ways to loosen it are edits to a tracked file:
# dropping a metric from CHIEF_QUALITY_METRICS, raising a tolerance here, or
# re-running `--write-baseline`. All three show up in a diff a reviewer reads.
# There is deliberately no implicit, invisible way to disable a metric.

# Tracked metrics (every one is lower-is-better). Drop a name to stop gating on
# it — a visible edit, which is the point.
# CHIEF_QUALITY_METRICS="duplicate_blocks duplicate_line_pct max_nesting_depth function_length_max function_length_mean single_use_functions lint_violations"

# Tolerance = how much WORSE the branch may be than the base, in the metric's own
# units. Zero where any regression is a real defect; non-zero where honest new
# work legitimately moves the number.
# CHIEF_QUALITY_TOL_duplicate_blocks=0        # a copied block is never accidental
# CHIEF_QUALITY_TOL_duplicate_line_pct=1      # percentage points
# CHIEF_QUALITY_TOL_max_nesting_depth=1       # one new level of nesting
# CHIEF_QUALITY_TOL_function_length_max=15    # lines
# CHIEF_QUALITY_TOL_function_length_mean=5    # lines
# CHIEF_QUALITY_TOL_single_use_functions=2    # over-decomposition: helpers nobody reuses
# CHIEF_QUALITY_TOL_lint_violations=0         # only counted where a linter exists

# Duplication window: N consecutive normalized source lines make a block. A
# baseline computed with a different window is NOT comparable, and the ratchet
# refuses to compare across one rather than pretending.
# CHIEF_QUALITY_DUP_WINDOW=6

# Where the committed whole-tree floor lives. Create it once with
#   bash engine/quality.sh ratchet --write-baseline
# and commit the result; without it only the changed-file delta axis runs.
# CHIEF_QUALITY_BASELINE=.chief/quality-baseline.json

# Skipping: CHIEF_VERIFY_QUALITY=0 skips this gate the way CHIEF_VERIFY_TESTS=0
# skips the behavioral suite, and NO_VERIFY=1 bypasses the whole verify hook.
