<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chief Observatory</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="research.css"><link rel="stylesheet" href="observatory.css"></head>
<body>
  <aside class="rail">
    <div class="brand"><span class="mark">C</span><div><strong>Chief</strong><small>Agentic work observatory</small></div></div>
    <nav id="nav" aria-label="Views"></nav>
    <div class="rail-foot"><span class="pulse"></span><span id="freshness">Collecting workspace</span></div>
  </aside>
  <main>
    <header><div><p class="eyebrow" id="workspace">WORKSPACE</p><h1 id="title">Observatory</h1><p id="lede">Native agent sessions, gauntlet lanes, decisions, evidence, and project plans.</p></div><label class="search"><span>⌕</span><input id="search" type="search" placeholder="Search loops, stages, projects…"></label></header>
    <section id="summary" class="summary"></section>
    <section id="content" aria-live="polite"></section>
  </main>
  <template id="empty"><div class="empty"><strong>No records in this view</strong><span>Run the collector or connect another source.</span></div></template>
  <script type="module" src="observatory.js"></script>
</body></html>
