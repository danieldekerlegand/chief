[package]
name = "chief-observatory"
version = "0.1.0"
description = "A desktop observer for native coding-agent gauntlets"
authors = ["Chief contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "chief_observatory_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
