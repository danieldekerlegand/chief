# .chief/zones.conf — this repo's OVERLAP ZONE REGISTRY (read by engine/zones.sh).
#
# Chief's correctness guarantee is the merge floor: every branch is rebased onto the
# latest base, re-verified, and merged --no-ff. That catches textual interference and
# staleness. It does not catch the other thing parallel agents do — each holds a
# different slice of context, so two branches can produce individually correct code
# whose DESIGNS disagree. Both rebase clean. Both verify green.
#
# A zone names a domain where that outcome is unacceptable, and asks a person.
#
#   <policy>   <matcher>              [reason — printed wherever the zone is reported]
#
#   policy    serialize  today's behaviour exactly: the scheduler already keeps two
#                        tasklists sharing a `touches` domain from co-running, and
#                        the merge phase is unchanged. Declaring one records the
#                        domain here, next to the ones that do hold a merge; it
#                        prints nothing and changes nothing at run time.
#             review     serialize AND require an explicit human approval before the
#                        merge — no matter how green the gate came back. The branch
#                        is held in state 'awaiting-approval' AFTER it has rebased
#                        and verified; `chief approve <name>` releases it.
#
#   matcher   path:<glob>       matched against each repo-relative changed path of
#                               the branch (`git diff --name-only <base>...HEAD`).
#                               `*` crosses `/`, so `engine/*.sh` also covers
#                               `engine/x/y.sh`; a trailing `/` means "everything
#                               beneath this directory".
#             touches:<domain>  an exact tasklist `touches` domain name. SECONDARY on
#                               purpose: `touches` tags are often conceptual labels
#                               that match no path at all, so a registry keyed on
#                               them alone is invisible exactly where it is needed.
#                               Prefer path matchers; add these only where your tags
#                               really are domains.
#             surface:<glob>:<ere>
#                               THE SAME GLOB, NARROWED to what within those files is
#                               load-bearing. It matches only when the branch's diff to
#                               a matching file ADDS OR REMOVES a line matching <ere>,
#                               so adding a routine consumer under a watched path does
#                               not hold, and rewriting the declaration it calls does.
#                               Reach for this when a `path:` rule holds so often that
#                               its approvals stop being read — an approval nobody
#                               reads is worse than no approval. Split at the FIRST
#                               colon, so a glob may not contain one — and the whole
#                               matcher is ONE WHITESPACE-FREE TOKEN, because the
#                               reason begins at the next space. Write a literal space
#                               inside an ERE as the bracket expression `[ ]`.
#
# DISARMING AND RE-ARMING IS ONE WORD. A rule that is costing more than it catches
# becomes `serialize` — it stays declared, stays visible, and stops holding — and it
# re-arms by putting `review` back. Nothing else about the line changes, and narrowing
# a rule with `surface:` is a separate, opt-in edit you can make when you choose.
#
# EVERY LINE HERE IS A COMMENT, so a freshly-scaffolded repo behaves exactly as it
# did before this file existed: no zones, no questions, no change to the merge phase.
# Uncomment and edit what applies. Full contract: docs/reference/overlap-zones.md
#
# review     path:src/schema/          the data model two agents must not diverge on
# review     path:*/migrations/*       schema migrations, in any package
# review     touches:auth
# serialize  path:docs/                documented, scheduled apart, merged as usual
#
# ...and the same schema rule, narrowed to the declarations rather than every file
# under the directory — the shape to move to when the coarse rule is being rubber-stamped:
# review     surface:src/schema/*.ts:^export[ ](type|interface|const)   the declared shape, not its readers
